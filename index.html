        /* تنسيقات حقول الإدخال العائمة */

<body>

<div id="app" class="app-container"></div>

<!-- Firebase SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, addDoc, query, where, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCdV3qgXHHxz4e8mf1c-2TrZujXqY-LuQc",
        authDomain: "black-9deb2.firebaseapp.com",
        projectId: "black-9deb2",
        storageBucket: "black-9deb2.firebasestorage.app",
        messagingSenderId: "725901940218",
        appId: "1:725901940218:web:bc10585da68be02dc14043"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = null;
    let currentPage = 'login';
    const appDiv = document.getElementById('app');

    // ---------------- دوال مساعدة ----------------
    function showToast(msg, bg = '#4CAF50') {
        let toast = document.createElement('div');
        toast.className = 'success-toast';
        toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
        toast.style.backgroundColor = bg;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4000);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '—';
        const d = dateStr.toDate ? dateStr.toDate() : new Date(dateStr);
        const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} - ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function navigate(page) {
        currentPage = page;
        render();
    }

    // ---------------- تسجيل الدخول ----------------
    async function login(identifier, password) {
        try {
            const usersRef = collection(db, "users");
            const q1 = query(usersRef, where("account_number", "==", identifier));
            const q2 = query(usersRef, where("username", "==", identifier));
            
            let snapshot = await getDocs(q1);
            if (snapshot.empty) snapshot = await getDocs(q2);

            if (snapshot.empty) throw new Error("رقم الحساب أو اسم المستخدم غير موجود");

            const userDoc = snapshot.docs[0];
            const userData = userDoc.data();

            if (userData.password !== password) throw new Error("كلمة المرور خاطئة");
            if (userData.status === 'banned') throw new Error("حسابك محظور");

            currentUser = { id: userDoc.id, ...userData };
            localStorage.setItem('bld_user_id', userDoc.id);
            showToast("تم تسجيل الدخول بنجاح");
            navigate('dashboard');
        } catch (error) {
            throw error;
        }
    }

    // ---------------- إنشاء حساب ----------------
    async function register(username, password) {
        return new Promise(async (resolve, reject) => {
            const timer = setTimeout(() => reject(new Error('انتهت المهلة: قاعدة البيانات ترفض الاتصال.')), 10000);
            try {
                const usersRef = collection(db, "users");
                const qUser = query(usersRef, where("username", "==", username));
                const userSnap = await getDocs(qUser);
                
                if (!userSnap.empty) { clearTimeout(timer); reject(new Error("اسم المستخدم مسجل بالفعل، جرب اسماً آخر")); return; }

                const randomPart = Math.floor(100 + Math.random() * 900); 
                const timePart = Math.floor(Date.now() / 1000).toString().slice(-4); 
                const accountNumber = timePart + randomPart; 

                const newUser = {
                    account_number: accountNumber,
                    username: username,
                    password: password,
                    balance: 0,
                    status: 'active',
                    role: 'user',
                    created_at: new Date()
                };

                await addDoc(usersRef, newUser);
                clearTimeout(timer);
                sessionStorage.setItem('new_account_number', accountNumber);
                resolve();
            } catch (error) {
                clearTimeout(timer);
                reject(error);
            }
        });
    }

    // ---------------- طلب شحن ----------------
    async function submitRecharge(amount, method, senderName, senderAccount, receiptBase64) {
        try {
            if (!currentUser) throw new Error("انتهت الجلسة");
            const txData = {
                user_id: currentUser.id,
                type: 'deposit',
                amount: parseFloat(amount),
                status: 'pending',
                method: method,
                sender_name: senderName,
                sender_account: senderAccount,
                receipt_url: receiptBase64 || null, 
                created_at: new Date()
            };
            await addDoc(collection(db, "transactions"), txData);
            showToast("✅ تم إرسال طلبك! سيصلك الرصيد بعد موافقة الإدارة");
            setTimeout(() => navigate('transactions'), 2000);
        } catch (error) {
            throw error;
        }
    }

    // ---------------- جلب المعاملات ----------------
    async function fetchTransactions() {
        if (!currentUser) return [];
        try {
            const txRef = collection(db, "transactions");
            const q = query(txRef, where("user_id", "==", currentUser.id));
            const snapshot = await getDocs(q);
            let txs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            txs.sort((a, b) => (b.created_at?.toDate?.() || new Date(b.created_at)) - (a.created_at?.toDate?.() || new Date(a.created_at)));
            return txs;
        } catch (error) {
            return [];
        }
    }

    // ---------------- الاشتراك في الاستثمار ----------------
    async function subscribeInvestment(round, amount, durationHours) {
        try {
            if (!currentUser) throw new Error("انتهت الجلسة");
            const principal = parseFloat(amount);
            const bonus = round === 'silver' ? 10000 : 5000;
            
            if (currentUser.balance < principal) throw new Error("رصيدك غير كافٍ");

            const startDate = new Date();
            const endDate = new Date(startDate.getTime() + durationHours * 60 * 60 * 1000);

            const invData = {
                user_id: currentUser.id,
                round_type: round,
                principal: principal,
                bonus: bonus,
                total_return: principal + bonus,
                duration_months: 1, // للتوافق
                start_date: startDate,
                end_date: endDate,
                status: 'active'
            };

            await addDoc(collection(db, "investments"), invData);
            
            // خصم المبلغ من الرصيد
            const userRef = doc(db, "users", currentUser.id);
            const newBalance = currentUser.balance - principal;
            await updateDoc(userRef, { balance: newBalance });
            currentUser.balance = newBalance;

            showToast("✅ تم الاشتراك بنجاح!");
            setTimeout(() => navigate('invest'), 2000);
        } catch (error) {
            throw error;
        }
    }

    // ---------------- جلب الاستثمارات ----------------
    async function fetchInvestments() {
        if (!currentUser) return [];
        try {
            const invRef = collection(db, "investments");
            const q = query(invRef, where("user_id", "==", currentUser.id));
            const snapshot = await getDocs(q);
            let invs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            invs.sort((a, b) => (b.start_date?.toDate?.() || new Date(b.start_date)) - (a.start_date?.toDate?.() || new Date(a.start_date)));
            return invs;
        } catch (error) {
            return [];
        }
    }

    // ---------------- واجهات المستخدم (Render) ----------------
    function render() {
        if (currentUser) {
            if (currentPage === 'login' || currentPage === 'register' || currentPage === 'success') currentPage = 'dashboard';
        } else {
            if (currentPage !== 'login' && currentPage !== 'register' && currentPage !== 'success') currentPage = 'login';
        }

        switch (currentPage) {
            case 'login': renderLogin(); break;
            case 'register': renderRegister(); break;
            case 'success': renderSuccess(); break;
            case 'dashboard': renderDashboard(); break;
            case 'transactions': renderTransactions(); break;
            case 'recharge': renderRecharge(); break;
            case 'invest': renderInvest(); break;
            case 'calculator': renderCalculator(); break;
        }
    }

    // ---------- صفحة تسجيل الدخول ----------
    function renderLogin() {
        appDiv.innerHTML = `
        <div class="flex flex-col h-full bg-white min-h-screen">
            <div class="header-bg text-white pt-10 pb-8 px-6 relative rounded-b-[20px] text-center">
                <div class="flex flex-col items-center mt-2">
                    <img src="https://i.ibb.co/8gSqTySf/256398-removebg-preview.png" class="h-16 object-contain mb-3">
                    <p class="text-sm font-medium mb-4">بلدنا للمدفوعات الرقمية</p>
                    <div class="flex items-center justify-center gap-2 text-xs text-white/90 bg-black/20 px-4 py-1.5 rounded-full mb-6">
                        <i class="fa-solid fa-shield-halved text-[#4CAF50]"></i> اتصال مشفّر وبيانات محمية
                    </div>
                    <h1 class="text-2xl font-bold mb-1">مرحباً بعودتك</h1>
                    <p class="text-sm font-medium opacity-90">سجّل الدخول لإدارة محفظتك</p>
                </div>
                <div class="absolute bottom-0 left-0 w-0 h-0 border-l-[50px] border-l-transparent border-b-[40px] border-b-[#2e7d32]"></div>
            </div>
            <div class="px-6 py-8 flex-1 flex flex-col">
                <div id="login-error" class="hidden bg-red-50 border border-red-300 text-red-700 text-sm font-medium rounded-xl p-3 mb-4 animate-shake"></div>
                <form id="loginForm" class="flex flex-col">
                    <div class="input-group">
                        <input type="text" name="identifier" id="identifier" placeholder=" " required>
                        <label for="identifier">رقم الحساب أو اسم المستخدم</label>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="password" placeholder=" " required inputmode="numeric" maxlength="4">
                        <label for="password">كلمة المرور</label>
                    </div>
                    <div class="flex items-center justify-between mb-6 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="rememberMe" class="w-4 h-4 text-[#b3262b] rounded border-gray-300 focus:ring-[#b3262b]">
                            <span class="text-sm text-gray-600 font-medium">تذكر بيانات الدخول</span>
                        </label>
                        <a href="#" class="text-sm text-[#b3262b] font-bold hover:underline">نسيت كلمة المرور؟</a>
                    </div>
                    <button type="submit" id="loginBtn" class="btn-color text-white font-bold text-lg py-3.5 rounded-xl transition hover:opacity-90">تسجيل الدخول</button>
                </form>
                <div class="text-center mt-6 text-sm text-gray-600">ليس لديك حساب؟ <a href="#" id="goToRegister" class="text-[#b3262b] font-bold">أنشئ حساباً</a></div>
            </div>
        </div>`;

        const identifierInput = document.getElementById('identifier');
        const rememberCheckbox = document.getElementById('rememberMe');
        const savedIdentifier = localStorage.getItem('bld_saved_account');
        if (savedIdentifier) {
            identifierInput.value = savedIdentifier;
            rememberCheckbox.checked = true;
        }

        document.getElementById('goToRegister').addEventListener('click', (e) => { e.preventDefault(); navigate('register'); });
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = identifierInput.value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';
            errorDiv.classList.add('hidden');
            try {
                if (rememberCheckbox.checked) localStorage.setItem('bld_saved_account', identifier);
                else localStorage.removeItem('bld_saved_account');
                await login(identifier, password);
            } catch (err) {
                errorDiv.textContent = '⚠️ ' + err.message;
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'تسجيل الدخول';
            }
        });
    }

    // ---------- صفحة إنشاء حساب ----------
    function renderRegister() {
        appDiv.innerHTML = `
        <div class="flex flex-col h-full bg-white min-h-screen">
            <div class="header-bg text-white pt-10 pb-6 px-6 relative rounded-b-[20px]">
                <a href="#" id="backToLogin" class="absolute top-6 right-6 w-10 h-10 bg-white/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></a>
                <div class="flex flex-col items-center mt-2">
                    <img src="https://i.ibb.co/8gSqTySf/256398-removebg-preview.png" class="h-16 object-contain mb-3">
                    <p class="text-sm font-medium mb-5">بلدنا للمدفوعات الرقمية</p>
                    <h1 class="text-2xl font-bold mb-2">إنشاء حساب جديد</h1>
                    <p class="text-sm font-medium">افتح محفظتك الآن</p>
                </div>
            </div>
            <div class="px-6 py-8 flex-1 flex flex-col justify-center">
                <div id="register-error" class="hidden bg-red-50 border border-red-300 text-red-700 text-sm font-medium rounded-xl p-3 mb-4 animate-shake"></div>
                <form id="registerForm" class="flex flex-col">
                    <div class="input-group">
                        <input type="text" name="username" id="username" placeholder=" " required>
                        <label for="username">اسم المستخدم</label>
                    </div>
                    <div class="input-group">
                        <input type="password" name="password" id="password" placeholder=" " required inputmode="numeric" pattern="[0-9]{4}" maxlength="4">
                        <label for="password">كلمة المرور (4 أرقام)</label>
                    </div>
                    <button type="submit" id="registerBtn" class="btn-color text-white font-bold text-lg py-3.5 rounded-xl mt-4 hover:opacity-90 transition">إنشاء حساب</button>
                </form>
            </div>
        </div>`;

        document.getElementById('backToLogin').addEventListener('click', (e) => { e.preventDefault(); navigate('login'); });
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('register-error');
            const btn = document.getElementById('registerBtn');

            if (!/^\d{4}$/.test(password)) {
                errorDiv.textContent = '⚠️ يرجى إدخال كلمة مرور مكونة من 4 أرقام فقط';
                errorDiv.classList.remove('hidden');
                return;
            }
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإنشاء...';
            errorDiv.classList.add('hidden');

            try {
                await register(username, password);
                currentPage = 'success';

    window.showTxDetails = function(tx) {

                    this.value = this.value.replace(/,/g, '').replace(/[^\d]/g, '');
                    if(parseInt(this.value) >= 1000) { next2.classList.add('active'); }
                    else { next2.classList.remove('active'); }
                });
                document.querySelectorAll('.quick-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        amtInput.value = parseInt(this.dataset.amount).toLocaleString('en-US');
                        if(parseInt(this.dataset.amount) >= 1000) next2.classList.add('active');
                    });
                });
                next2.addEventListener('click', () => {
                    amountVal = amtInput.value;
                    if (!amountVal || parseFloat(amountVal.replace(/,/g,'')) < 1000) return alert('الحد الأدنى 1000 SDG');
                    step++; renderStep();
                });
            } else if (step === 3) {
                document.getElementById('nextBtn3').addEventListener('click', () => {
                    senderNameVal = document.getElementById('sender-name-input').value;
                    senderAccVal = document.getElementById('sender-account-input').value;
                    if (!senderNameVal) return alert('أدخل اسمك');
                    step++; renderStep();
                });
            } else if (step === 4) {
                const fileInput = document.getElementById('file-input');
                const uploadBox = document.getElementById('upload-box');
                const previewImg = document.getElementById('image-preview');
                const uploadIcon = document.getElementById('upload-icon');

                uploadBox.addEventListener('click', () => fileInput.click());
                fileInput.addEventListener('change', (e) => {
                    if (e.target.files && e.target.files[0]) {
                        receiptFile = e.target.files[0];
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            previewImg.src = ev.target.result;
                            previewImg.style.display = 'block';
                            uploadBox.classList.add('uploaded');
                            document.getElementById('upload-title').innerText = 'تم إرفاق الصورة!';
                            document.getElementById('upload-desc').innerText = 'اضغط لتغيير الصورة';
                            uploadIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
                        };
                        reader.readAsDataURL(receiptFile);
                    }
                });

                document.getElementById('submitBtn').addEventListener('click', async function() {
                    if (!receiptFile) return alert('أرفق الصورة أولاً');
                    this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';
                    this.disabled = true;

                    const reader = new FileReader();
                    reader.onload = async (ev) => {
                        const base64Img = ev.target.result;
                        try {
                            await submitRecharge(amountVal.replace(/,/g,''), selectedMethod, senderNameVal, senderAccVal, base64Img);
                        } catch (err) {
                            showToast(err.message, '#d32f2f');
                            this.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إعادة المحاولة';
                            this.disabled = false;
                        }
                    };
                    reader.readAsDataURL(receiptFile);
                });
            }
        };
        renderStep();
    }

    // ---------- صفحة الاستثمار ----------
    async function renderInvest() {
        if (!currentUser) return;
        const invs = await fetchInvestments();
        let invHtml = '';
        
        if (invs.length > 0) {
            invHtml += `<div class="section-label"><i class="fa-solid fa-briefcase"></i> استثماراتي (${invs.length})</div>
            <div class="invest-cards-container" style="padding-bottom:15px">`;
            invs.forEach(inv => {
                const isDone = inv.status === 'completed';
                const title = inv.round_type === 'silver' ? 'الجولة الفضية' : 'الجولة القياسية (20%)';
                const start = inv.start_date?.toDate?.() || new Date(inv.start_date);
                const end = inv.end_date?.toDate?.() || new Date(inv.end_date);
                const now = new Date();
                const totalSec = Math.max(1, (end - start) / 1000);
                const elapsedSec = Math.max(0, (now - start) / 1000);
                const progress = isDone ? 100 : Math.min(100, Math.max(1, Math.round((elapsedSec / totalSec) * 100)));
                const earned = Math.round(inv.bonus * progress / 100);

                invHtml += `
                <div class="my-inv-card">
                    <div class="my-inv-header">
                        <div class="my-inv-header-right">
                            <div class="my-inv-icon-box"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/><path d="M15 6h4v4"/></svg></div>
                            <div class="my-inv-title-area"><h2>${title}</h2><p>بدأت ${formatDate(inv.start_date)}</p></div>
                        </div>
                        <div class="my-inv-badge ${isDone?'completed':''}">${isDone?'مكتملة ✓':'نشطة'}</div>
                    </div>
                    <div class="my-inv-progress">
                        <div class="my-inv-progress-labels"><span class="label">نسبة الإنجاز</span><span class="percent">${progress}%</span></div>
                        <div class="my-inv-progress-bar"><div class="my-inv-progress-fill" style="width:${progress}%"></div></div>
                    </div>
                    <div class="my-inv-footer">
                        <div class="my-inv-stat"><span class="label">المبلغ</span><span class="value">SDG ${parseFloat(inv.principal).toLocaleString()}</span></div>
                        <div class="my-inv-stat"><span class="label">المكتسب</span><span class="value green">+ ${earned.toLocaleString()}</span></div>
                        <div class="my-inv-stat"><span class="label">المكافأة</span><span class="value">${parseFloat(inv.bonus).toLocaleString()}</span></div>
                    </div>
                </div>`;
            });
            invHtml += `</div><div class="section-label"><i class="fa-solid fa-plus-circle"></i> ابدأ جولة جديدة</div>`;
        }

        appDiv.innerHTML = `
        <div class="flex flex-col h-full bg-[#F5F6F9] pb-20 min-h-screen">
            <div class="invest-header">
                <div class="invest-brand"><div class="invest-brand-logo">ب</div><div class="invest-brand-text"><h2>بلدنا</h2><p>للمدفوعات الرقمية</p></div></div>
                <a href="#" id="backToDash" class="invest-back-btn"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
            <div class="invest-title-section"><h1>الاستثمار</h1><p>تابع استثماراتك وابدأ جولات جديدة</p></div>
            ${invHtml}
            <div class="invest-cards-container">
                <div class="invest-card">
                    <div class="invest-card-content">
                        <div class="invest-card-header"><div class="invest-card-title">الجولة القياسية (20%)</div><div class="invest-badge">الأكثر طلباً</div></div>
                        <div class="invest-card-subtitle">مكافأة 5,000 SDG خلال 24 ساعة</div>
                        <div class="invest-stats-row">
                            <div><span class="invest-percentage">+5K</span><span class="invest-percentage-label">مكافأة ثابتة</span></div>
                            <div class="invest-stat-duration"><span class="invest-duration-months">24 ساعة</span><span class="invest-duration-amount">من SDG 3K</span></div>
                        </div>
                        <div class="invest-features-container">
                            <div><div class="invest-pill">+ SDG 5,000 مكافأة</div></div>
                            <div class="invest-features-right"><div class="invest-pill">مكافأة بعد 24 ساعة</div><div class="invest-pill">سحب مباشر</div><div class="invest-pill">حماية كاملة</div></div>
                        </div>
                        <button class="invest-btn" data-round="standard">احسب عائدك واشترك <i class="fa-solid fa-calculator"></i></button>
                    </div>
                </div>
                <div class="invest-card">
                    <div class="invest-card-content">
                        <div class="invest-card-header"><div class="invest-card-title">الجولة الفضية</div></div>
                        <div class="invest-card-subtitle">مكافأة 10,000 SDG خلال 24 ساعة</div>
                        <div class="invest-stats-row">
                            <div><span class="invest-percentage">+10K</span><span class="invest-percentage-label">مكافأة ثابتة</span></div>
                            <div class="invest-stat-duration"><span class="invest-duration-months">24 ساعة</span><span class="invest-duration-amount">من SDG 20K</span></div>
                        </div>
                        <div class="invest-features-container">
                            <div><div class="invest-pill">+ SDG 10,000 مكافأة</div></div>
                            <div class="invest-features-right"><div class="invest-pill">مكافأة بعد 24 ساعة</div><div class="invest-pill">أولوية السحب</div><div class="invest-pill">تغطية سيولة</div></div>
                        </div>
                        <button class="invest-btn" data-round="silver">احسب عائدك واشترك <i class="fa-solid fa-calculator"></i></button>
                    </div>
                </div>
            </div>
            <div class="bottom-nav">
                <a href="#" id="navHome" class="nav-item"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
                <a href="#" id="navTx" class="nav-item"><i class="fa-regular fa-file-lines"></i><span>المعاملات</span></a>
                <a href="#" class="nav-item active"><i class="fa-solid fa-chart-line"></i><span>الاستثمار</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-receipt"></i><span>الإيصالات</span></a>
                <a href="#" class="nav-item"><i class="fa-regular fa-user"></i><span>حسابي</span></a>
            </div>
        </div>`;

        document.getElementById('backToDash').addEventListener('click', (e) => { e.preventDefault(); navigate('dashboard'); });
        document.getElementById('navHome').addEventListener('click', (e) => { e.preventDefault(); navigate('dashboard'); });
        document.getElementById('navTx').addEventListener('click', (e) => { e.preventDefault(); navigate('transactions'); });
        
        document.querySelectorAll('.invest-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const round = this.dataset.round;
                navigate('calculator');
                setTimeout(() => renderCalculator(round), 50);
            });
        });
    }

    // ---------- صفحة الحاسبة ----------
    function renderCalculator(round = 'standard') {
        if (!currentUser) return;
        const isSilver = round === 'silver';
        const cfg = isSilver 
            ? { title:'حاسبة الجولة الفضية', subtitle:'مكافأة 10,000 SDG خلال 24 ساعة', min:20000, max:100000, def:20000, bonus:10000, minL:'20K', maxL:'100K', round }
            : { title:'حاسبة الجولة القياسية (20%)', subtitle:'مكافأة 5,000 SDG خلال 24 ساعة', min:3000, max:20000, def:3000, bonus:5000, minL:'3K', maxL:'20K', round };

        appDiv.innerHTML = `
        <div class="flex flex-col h-full bg-[#f4f4f4] min-h-screen">
            <div class="invest-header">
                <div class="invest-brand"><div class="invest-brand-logo">ب</div><div class="invest-brand-text"><h2>بلدنا</h2><p>للمدفوعات الرقمية</p></div></div>
                <a href="#" id="backToInvest" class="invest-back-btn"><i class="fa-solid fa-chevron-right"></i></a>
            </div>
            <div class="calc-page-wrapper">
                <div class="calc-page-card">
                    <div class="top-handle"></div>
                    <h1 class="header-title">${cfg.title}</h1>
                    <p class="header-subtitle">${cfg.subtitle}</p>
                    <div class="savings-card">
                        <div class="card-header">
                            <div class="card-title"><h2>مبلغ الادخار</h2><span>PRINCIPAL</span></div>
                            <div class="amount-display" id="amountDisplay">SDG ${cfg.def.toLocaleString()}</div>
                        </div>
                        <input type="range" min="${cfg.min}" max="${cfg.max}" value="${cfg.def}" step="100" id="savingsSlider">
                        <div class="slider-labels"><span>${cfg.minL}</span><span>${cfg.maxL}</span></div>
                    </div>
                    <div class="gradient-box"></div>
                    <div class="detail-row"><div class="detail-title"><h3>المكافأة الثابتة</h3><span>FIXED BONUS</span></div><div class="detail-value text-green">+ SDG ${cfg.bonus.toLocaleString()}</div></div>
                    <div class="detail-row"><div class="detail-title"><h3>مدة الاستحقاق</h3><span>DURATION</span></div><div class="detail-value text-dark">24 ساعة</div></div>
                    <div class="detail-row"><div class="detail-title"><h3>الإجمالي عند الاستحقاق</h3><span>AT MATURITY</span></div><div class="detail-value text-red" id="totalMaturity">SDG ${(cfg.def + cfg.bonus).toLocaleString()}</div></div>
                    <div class="detail-row"><div class="detail-title"><h3>صرف العائد</h3><span>PAYOUT</span></div><div class="detail-value text-dark">تلقائي بعد 24 ساعة</div></div>
                    
                    <div id="calc-error" class="hidden bg-red-100 text-red-700 p-2 rounded mt-4 text-sm text-center font-bold animate-shake"></div>
                    <button id="subscribeBtn" class="btn-subscribe mt-4">اشترك الآن</button>
                </div>
            </div>
        </div>`;

        const slider = document.getElementById('savingsSlider');
        const amtDisplay = document.getElementById('amountDisplay');
        const totalMat = document.getElementById('totalMaturity');
        
        slider.addEventListener('input', () => {
            const p = parseInt(slider.value);
            amtDisplay.innerText = 'SDG ' + p.toLocaleString();
            totalMat.innerText = 'SDG ' + (p + cfg.bonus).toLocaleString();
        });

        document.getElementById('backToInvest').addEventListener('click', (e) => { e.preventDefault(); navigate('invest'); });

        document.getElementById('subscribeBtn').addEventListener('click', async function() {
            const p = parseInt(slider.value);
            if (confirm(`الاشتراك بـ ${p.toLocaleString()} SDG؟\nستحصل على ${(p + cfg.bonus).toLocaleString()} SDG بعد 24 ساعة.`)) {
                this.disabled = true;
                this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري المعالجة...';
                try {
                    await subscribeInvestment(cfg.round, p, 24);
                } catch (err) {
                    document.getElementById('calc-error').innerText = err.message;
                    document.getElementById('calc-error').classList.remove('hidden');
                    this.disabled = false;
                    this.innerText = 'اشترك الآن';
                }
            }
        });
    }

    // ---------------- التشغيل الأولي ----------------
    async function init() {
        const savedUserId = localStorage.getItem('bld_user_id');
        if (savedUserId) {
            try {
                const userDoc = await getDoc(doc(db, "users", savedUserId));
                if (userDoc.exists()) {
                    currentUser = { id: userDoc.id, ...userDoc.data() };
                    currentPage = 'dashboard';
                }
            } catch (e) { console.error(e); }
        }
        render();
    }

    init();
</script>
