<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بلدنا - إنشاء حساب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f9f9f9; }
        .header-bg { background: #a82525; }
        .btn-color { background: #b3262b; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { 
            width: 100%; padding: 16px; border: 1px solid #d1d5db; 
            border-radius: 12px; font-size: 15px; background: transparent; 
            color: #111; outline: none; transition: 0.2s;
        }
        .input-group input:focus { border-color: #b3262b; box-shadow: 0 0 0 3px rgba(179,38,43,.1); }
        .input-group label { 
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%); 
            color: #9ca3af; font-size: 15px; pointer-events: none; 
            transition: 0.2s ease all; background: #fff; padding: 0 4px;
        }
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: 0; font-size: 11px; color: #b3262b; font-weight: 700;
        }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
        .animate-shake { animation: shake .4s; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #b3262b; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <div id="app" class="w-full max-w-md bg-white min-h-screen shadow-lg relative overflow-hidden flex flex-col"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCdV3qgXHHxz4e8mf1c-2TrZujXqY-LuQc",
            authDomain: "black-9deb2.firebaseapp.com",
            projectId: "black-9deb2",
            storageBucket: "black-9deb2.firebasestorage.app",
            messagingSenderId: "725901940218",
            appId: "1:725901940218:web:bc10585da68be02dc14043"
        };

        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }

        let currentPage = 'register';
        const appDiv = document.getElementById('app');

        // دالة إنشاء الحساب
        async function register(username, password) {
            return new Promise(async (resolve, reject) => {
                // مؤقت 10 ثواني لقطع الاتصال إذا كان هناك خطأ في القواعد
                const timer = setTimeout(() => {
                    reject(new Error('انتهت المهلة: قاعدة البيانات ترفض الاتصال. تأكد من تفعيل قاعدة البيانات ووضع القواعد (Rules) على allow read, write: if true;'));
                }, 10000);

                try {
                    const usersRef = collection(db, "users");
                    
                    // 1. التحقق من اسم المستخدم
                    const qUser = query(usersRef, where("username", "==", username));
                    const userSnap = await getDocs(qUser);
                    
                    if (!userSnap.empty) {
                        clearTimeout(timer);
                        reject(new Error("اسم المستخدم مسجل بالفعل، جرب اسماً آخر"));
                        return;
                    }

                    // 2. توليد رقم الحساب
                    const randomPart = Math.floor(100 + Math.random() * 900); 
                    const timePart = Math.floor(Date.now() / 1000).toString().slice(-4); 
                    const accountNumber = timePart + randomPart; 

                    // 3. حفظ البيانات
                    const newUser = {
                        account_number: accountNumber,
                        username: username,
                        password: password,
                        balance: 0,
                        status: 'active',
                        role: 'user',
                        created_at: new Date()
                    };

                    await addDoc(usersRef, newUser);
                    
                    clearTimeout(timer);
                    sessionStorage.setItem('new_account_number', accountNumber);
                    resolve();
                } catch (error) {
                    clearTimeout(timer);
                    reject(error);
                }
            });
        }

        // واجهة إنشاء الحساب
        function renderRegister() {
            appDiv.innerHTML = `
            <div class="flex flex-col h-full bg-white">
                <div class="header-bg text-white pt-10 pb-6 px-6 relative rounded-b-[20px]">
                    <div class="flex flex-col items-center mt-2">
                        <img src="https://i.ibb.co/8gSqTySf/256398-removebg-preview.png" class="h-16 object-contain mb-3">
                        <p class="text-sm font-medium mb-5">بلدنا للمدفوعات الرقمية</p>
                        <h1 class="text-2xl font-bold mb-2">إنشاء حساب جديد</h1>
                        <p class="text-sm font-medium">افتح محفظتك الآن</p>
                    </div>
                </div>
                <div class="px-6 py-8 flex-1 flex flex-col justify-center">
                    <div id="register-error" class="hidden bg-red-50 border border-red-300 text-red-700 text-sm font-medium rounded-xl p-3 mb-4 animate-shake"></div>
                    
                    <form id="registerForm" class="flex flex-col">
                        <div class="input-group">
                            <input type="text" name="username" id="username" placeholder=" " required>
                            <label for="username">اسم المستخدم</label>
                        </div>
                        <div class="input-group">
                            <input type="password" name="password" id="password" placeholder=" " required inputmode="numeric" pattern="[0-9]{4}" maxlength="4">
                            <label for="password">كلمة المرور (4 أرقام)</label>
                        </div>
                        <button type="submit" id="submitBtn" class="btn-color text-white font-bold text-lg py-3.5 rounded-xl mt-4 hover:opacity-90 transition flex justify-center items-center gap-2">
                            <span>إنشاء حساب</span>
                        </button>
                    </form>
                </div>
            </div>`;

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                const errorDiv = document.getElementById('register-error');
                const submitBtn = document.getElementById('submitBtn');

                if (!/^\d{4}$/.test(password)) {
                    errorDiv.textContent = '⚠️ يرجى إدخال كلمة مرور مكونة من 4 أرقام فقط';
                    errorDiv.classList.remove('hidden');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = '<div class="loader"></div> <span>جاري الإنشاء...</span>';
                errorDiv.classList.add('hidden');

                try {
                    await register(username, password);
                    currentPage = 'success';
                    render();
                } catch (err) {
                    errorDiv.textContent = '⚠️ ' + err.message;
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>إعادة المحاولة</span>';
                }
            });
        }

        // واجهة النجاح
        function renderSuccess() {
            const accountNumber = sessionStorage.getItem('new_account_number');
            if (!accountNumber) { currentPage = 'register'; render(); return; }
            
            appDiv.innerHTML = `
            <div class="flex flex-col h-full bg-white">
                <div class="header-bg text-white pt-12 pb-10 px-6 relative rounded-b-[20px] text-center animate-pop">
                    <div class="flex flex-col items-center mt-2">
                        <img src="https://i.ibb.co/8gSqTySf/256398-removebg-preview.png" class="h-20 object-contain mb-4">
                        <p class="text-sm font-medium mb-6">بلدنا للمدفوعات الرقمية</p>
                        <div class="w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6 animate-pulse-check"><i class="fa-solid fa-check text-5xl text-white"></i></div>
                        <h1 class="text-2xl font-extrabold mb-3 text-center">مبروك! 🎉</h1>
                        <p class="text-base font-medium text-center">تم إنشاء حسابك بنجاح</p>
                    </div>
                    <div class="absolute bottom-0 left-0 w-0 h-0 border-l-[50px] border-l-transparent border-b-[40px] border-b-[#2e7d32]"></div>
                </div>
                <div class="px-6 py-8 flex-1 flex flex-col justify-center animate-pop">
                    <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center justify-center gap-2 mb-4"><div class="w-9 h-9 bg-[#b3262b] rounded-lg flex items-center justify-center"><i class="fa-solid fa-hashtag text-white text-sm"></i></div><div class="text-sm font-bold text-[#b3262b]">رقم الحساب الخاص بك</div></div>
                        <div class="text-4xl font-extrabold text-[#b3262b] tracking-widest font-mono text-center py-3" style="direction:ltr">${accountNumber}</div>
                        <button type="button" id="copyBtn" class="w-full mt-4 py-3 bg-[#b3262b] text-white rounded-xl font-bold flex justify-center items-center gap-2 shadow-lg"><i class="fa-regular fa-copy"></i> نسخ رقم الحساب</button>
                    </div>
                </div>
            </div>`;

            document.getElementById('copyBtn').addEventListener('click', () => {
                navigator.clipboard.writeText(accountNumber).then(() => alert('تم نسخ رقم الحساب!'));
            });
        }

        function render() {
            switch (currentPage) {
                case 'register': renderRegister(); break;
                case 'success': renderSuccess(); break;
                default: renderRegister(); break;
            }
        }

        render();
    </script>
</body>
</html>
