function formatDate(dateStr){if(!dateStr)return '—';const d=dateStr.toDate?dateStr.toDate():new Date(dateStr);const m=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];return `${d.getDate()} ${m[d.getMonth()]} ${d.getFullYear()} - ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function formatShortDate(dateStr){if(!dateStr)return '—';const d=dateStr.toDate?dateStr.toDate():new Date(dateStr);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function formatShortTime(dateStr){if(!dateStr)return '—';const d=dateStr.toDate?dateStr.toDate():new Date(dateStr);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;}

async function login(identifier, password){
const usersRef=collection(db,"users");
const q1=query(usersRef,where("account_number","==",identifier));
const q2=query(usersRef,where("username","==",identifier));
let snapshot=await getDocs(q1);
if(snapshot.empty)snapshot=await getDocs(q2);
if(snapshot.empty)throw new Error("رقم الحساب أو اسم المستخدم غير موجود");
const userDoc=snapshot.docs[0];const userData=userDoc.data();
if(userData.password!==password)throw new Error("كلمة المرور خاطئة");
if(userData.status==='banned')throw new Error("حسابك محظور");
currentUser={id:userDoc.id,...userData};
localStorage.setItem('bld_user_id',userDoc.id);
cachedTransactions=null;cachedInvestments=null;
navigate('dashboard');
}

async function register(username,password,extra={}){
return new Promise(async(resolve,reject)=>{
const timer=setTimeout(()=>reject(new Error('انتهت المهلة')),10000);
try{
const usersRef=collection(db,"users");
const qUser=query(usersRef,where("username","==",username));
const userSnap=await getDocs(qUser);
if(!userSnap.empty){clearTimeout(timer);reject(new Error("اسم المستخدم مسجل بالفعل"));return;}
const randomPart=Math.floor(100+Math.random()*900);
const timePart=Math.floor(Date.now()/1000).toString().slice(-4);
const accountNumber=timePart+randomPart;
const newUser={account_number:accountNumber,username,password,full_name:extra.full_name_ar||username,full_name_en:extra.full_name_en||'',phone:extra.phone||'0100000000',balance:0,status:'active',role:'user',created_at:new Date()};
await addDoc(usersRef,newUser);
clearTimeout(timer);
sessionStorage.setItem('new_account_number',accountNumber);
resolve();
}catch(error){clearTimeout(timer);reject(error);}
});
}

async function submitInvestment(round,amount){
const principal=parseFloat(amount);
let bonus=0;
if(round==='silver'){bonus=3000+((principal-20000)/80000)*7000;}else{bonus=1000+((principal-3000)/17000)*4000;}
if(currentUser.balance<principal)throw new Error("رصيدك غير كافٍ");
const userRef=doc(db,"users",currentUser.id);
const newBalance=currentUser.balance-principal;
await updateDoc(userRef,{balance:newBalance});
currentUser.balance=newBalance;
const startDate=new Date();
const endDate=new Date(startDate.getTime()+24*60*60*1000);
const invData={user_id:currentUser.id,round_type:round,principal,bonus,total_return:principal+bonus,start_date:startDate,end_date:endDate,status:'active'};
await addDoc(collection(db,"investments"),invData);
cachedInvestments=null;
navigate('invest');
}

async function fetchInvestments(force=false){
if(!currentUser)return [];
if(!force&&cachedInvestments&&(Date.now()-cacheTime<CACHE_DURATION))return cachedInvestments;
const invRef=collection(db,"investments");
const q=query(invRef,where("user_id","==",currentUser.id));
const snapshot=await getDocs(q);
let invs=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
const now=new Date();let addedBalance=false;let newBalance=currentUser.balance;
for(let inv of invs){
const endDate=inv.end_date?.toDate?.()||new Date(inv.end_date);
if(inv.status==='active'&&now>=endDate){
newBalance+=inv.principal+inv.bonus;inv.status='completed';
await updateDoc(doc(db,"investments",inv.id),{status:'completed'});
addedBalance=true;
}
}
if(addedBalance){
const userRef=doc(db,"users",currentUser.id);
await updateDoc(userRef,{balance:newBalance});
currentUser.balance=newBalance;
}
invs.sort((a,b)=>(b.start_date?.toDate?.()||new Date(b.start_date))-(a.start_date?.toDate?.()||new Date(a.start_date)));
cachedInvestments=invs;cacheTime=Date.now();
return invs;
}

async function fetchTransactions(force=false){
if(!currentUser)return [];
if(!force&&cachedTransactions&&(Date.now()-cacheTime<CACHE_DURATION))return cachedTransactions;
const txRef=collection(db,"transactions");
const q=query(txRef,where("user_id","==",currentUser.id));
const snapshot=await getDocs(q);
let txs=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
txs.sort((a,b)=>(b.created_at?.toDate?.()||new Date(b.created_at))-(a.created_at?.toDate?.()||new Date(a.created_at)));
cachedTransactions=txs;cacheTime=Date.now();
return txs;
}

async function fetchReceipts(){
if(!currentUser)return [];
const txRef=collection(db,"transactions");
const q=query(txRef,where("user_id","==",currentUser.id),where("type","==","withdrawal"));
const snapshot=await getDocs(q);
let txs=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
txs.sort((a,b)=>(b.created_at?.toDate?.()||new Date(b.created_at))-(a.created_at?.toDate?.()||new Date(a.created_at)));
return txs;
}

function render(){

filteredTxs.forEach(tx=>{

window.copyToClipboard=function(text){if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>{});}};
window.handleLogout=function(){
if(confirm('تسجيل الخروج؟')){
localStorage.removeItem('bld_user_id');
currentUser=null;cachedTransactions=null;cachedInvestments=null;
navigate('login');
}
};

async function init(){
const savedUserId=localStorage.getItem('bld_user_id');
if(savedUserId){
try{
const userDoc=await getDoc(doc(db,"users",savedUserId));
if(userDoc.exists()){currentUser={id:userDoc.id,...userDoc.data()};currentPage='dashboard';}
}catch(e){console.error(e);}
}
render();
}
init();
</script>
